<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5f0">
    <title>일기 쓰기 | 마음 기록</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/data.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/list.js" defer></script>
    <script src="js/stats.js" defer></script>
    <script src="js/write.js" defer></script>
    <script src="js/detail.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body data-page="write">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="마음 기록 홈">
        <span class="brand-mark" aria-hidden="true">마음</span>
        <span>마음 기록</span>
      </a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a class="nav-link" href="index.html"><span>일기</span><span>목록</span></a>
        <a class="nav-link active" href="write.html" aria-current="page"><span>일기</span><span>쓰기</span></a>
        <a class="nav-link" href="stats.html"><span>통계</span></a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="다크 모드로 전환">
        <span id="theme-icon" aria-hidden="true">☾</span>
        <span id="theme-label">다크 모드</span>
      </button>
      <span class="visually-hidden" id="theme-status" role="status" aria-live="polite"></span>
    </header>

    <main class="app-shell narrow-shell">
      <a class="back-link" href="index.html">← 일기 목록</a>
      <section class="intro write-intro" aria-labelledby="page-title">
        <p class="eyebrow">NEW ENTRY</p>
        <h1 id="page-title">오늘의 마음을 기록해요</h1>
        <p>길게 쓰지 않아도 괜찮아요. 지금의 마음을 남겨 보세요.</p>
      </section>

      <section class="panel composer-page-panel" aria-label="일기 작성">
        <form id="diary-form">
          <fieldset class="mode-fieldset">
            <legend>작성 모드</legend>
            <div class="mode-options">
              <label class="mode-option">
                <input type="radio" name="mode" value="simple" checked>
                <span>간단 모드</span>
              </label>
              <label class="mode-option">
                <input type="radio" name="mode" value="general">
                <span>일반 모드</span>
              </label>
            </div>
          </fieldset>

          <p id="draft-status" class="draft-status" role="status" aria-live="polite">
            작성 내용은 자동으로 임시 저장됩니다.
          </p>

          <div id="simple-title-field" class="form-field">
            <label for="simple-title">오늘을 한마디로</label>
            <select id="simple-title" name="simpleTitle">
              <option value="">제목을 선택해 주세요</option>
              <option value="좋았다">좋았다</option>
              <option value="별로였다">별로였다</option>
              <option value="그저 그랬다">그저 그랬다</option>
              <option value="새로운 일이 있었다">새로운 일이 있었다</option>
              <option value="직접 입력">직접 입력</option>
            </select>
            <input id="simple-custom-title" class="custom-title" type="text" maxlength="60"
              placeholder="오늘을 한마디로 적어 주세요" aria-label="직접 입력할 제목" hidden>
          </div>

          <div id="general-title-field" class="form-field" hidden>
            <label for="general-title">제목</label>
            <input id="general-title" name="generalTitle" type="text" maxlength="60"
              placeholder="오늘의 제목을 입력해 주세요">
          </div>

          <fieldset class="form-field mood-fieldset">
            <legend>오늘의 감정 <span class="required-mark" aria-label="필수">*</span></legend>
            <div id="mood-options" class="mood-options"></div>
          </fieldset>

          <div class="form-field">
            <label for="diary-content">내용 <span id="content-requirement" class="field-hint">(선택)</span></label>
            <textarea id="diary-content" name="content" rows="12" maxlength="2000"
              placeholder="오늘 어떤 일이 있었나요? 마음에 남은 것을 천천히 적어 보세요."></textarea>
          </div>

          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          <button class="primary-button" type="submit"><span aria-hidden="true">＋</span> 일기 저장하기</button>
        </form>
      </section>
      <p class="privacy-note"><span aria-hidden="true">🔒</span> 일기는 이 브라우저에만 저장돼요.</p>
    </main>
  </body>
</html>
